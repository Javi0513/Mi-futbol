name: Android (APK y AAB)

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar AAB y APK (sin firmar)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Publicar en la rama android-salida
        run: |
          mkdir salida
          cp android/app/build/outputs/bundle/release/*.aab salida/
          cp android/app/build/outputs/apk/release/*.apk salida/
          cd salida
          git init -q -b android-salida
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-salida
