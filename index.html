.lineup-layout>div{min-width:0}.field:before,.field:after,.field .line,.field .circle{pointer-events:none}.slot{z-index:2}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}.pchips{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow:auto;margin:0 0 10px;padding:2px}.pchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#20392f;border:1px solid #345044;font-size:12px;font-weight:700;color:#e7f2e5;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x;white-space:nowrap}.pchip .avatar{width:24px;height:24px;border-radius:50%;font-size:12px}.pchip.placed{opacity:.45}.pchip.sel{outline:2px solid #c8f293;opacity:1}.slot button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}.slot button.sel{outline:3px solid #c8f293;outline-offset:2px}.slot button.over{outline:3px solid #fff;transform:scale(1.15)}.ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-140%);background:#c8f293;color:#10241b;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px #0009}@media(min-width:701px){.field{width:min(100%,max(300px,calc((100vh - 340px)*.7)));margin:0 auto}}@media(pointer:coarse){.pchips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;padding-bottom:6px}}@media(max-width:700px){.slot{width:60px}.slot button{width:40px;height:40px;font-size:17px}.slot span{font-size:10px;padding:2px}}

<body><main class="wrap"><section id="login" class="panel login"><h1>Mi Fútbol<span style="color:#c8f293">.</span></h1><p class="muted">Acceso privado del equipo.</p><div id="loginmsg"></div><form id="auth"><label>Email<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="6" required></label><div class="actions"><button class="primary" data-auth="login">Entrar</button></div></form></section>
<section id="app" class="hidden"><div class="topbar"><div><div class="over">Gestiona tu equipo</div><h1>Mi Fútbol<span style="color:#c8f293">.</span></h1><p class="muted">Alineaciones, minutos y estadísticas.</p></div><button class="secondary small" id="logout">Salir</button></div><div class="switch"><button data-mode="7" class="on">Fútbol 7</button><button data-mode="11">Fútbol 11</button></div><div id="message"></div><div id="stats" class="stats"></div><div class="tabs"><button data-tab="plantilla" class="on">Plantilla</button><button data-tab="partidos">Partidos</button><button data-tab="resumen">Estadísticas</button></div><div id="view"></div></section></main>
<div id="modal" class="modal hidden"><div class="dialog"><h2 id="modalTitle">Jugador</h2><form id="playerForm"><label>Nombre<input name="nombre" required maxlength="90"></label><label>Foto<input name="foto" type="file" accept="image/*"></label><div class="actions"><button class="primary">Guardar</button><button type="button" class="secondary" id="closeModal">Cancelar</button></div></form></div></div>
<script>
(()=>{const c=window.APP_CONFIG||{};const db=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const state={mode:'7',tab:'plantilla',players:[],matches:[],draft:null,editing:null,selectedSlot:null,selectedChip:null,justDragged:false,playerId:null,busy:false};const mk=(...L)=>{const n=L.length,o=[['POR',50,92]];L.forEach((c,li)=>{const y=Math.round((76-li*(52/(n-1)))*10)/10,lab=li===0?'DEF':li===n-1?'ATA':'MED',m=c===2?30:c===3?19:c===4?13:10;for(let k=0;k<c;k++)o.push([lab,c===1?50:Math.round((m+k*(100-2*m)/(c-1))*10)/10,y])});return o};
const formations={7:{'2-3-1':mk(2,3,1),'3-2-1':mk(3,2,1),'3-3':mk(3,3),'2-2-2':mk(2,2,2),'3-1-2':mk(3,1,2),'1-3-2':mk(1,3,2),'1-2-3':mk(1,2,3),'2-1-2-1':mk(2,1,2,1)},11:{'4-3-3':mk(4,3,3),'4-4-2':mk(4,4,2),'3-4-3':mk(3,4,3),'4-2-3-1':mk(4,2,3,1),'4-5-1':mk(4,5,1),'3-5-2':mk(3,5,2),'5-3-2':mk(5,3,2),'5-4-1':mk(5,4,1),'4-1-4-1':mk(4,1,4,1),'4-3-2-1':mk(4,3,2,1),'4-4-1-1':mk(4,4,1,1)}};

const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])), avatar=p=>p?.foto?.startsWith('data:')?`<img class="avatar" src="${esc(p.foto)}" alt="">`:`<div class="avatar">${esc((p?.nombre||'?')[0].toUpperCase())}</div>`, modeCount=()=>Number(state.mode), roster=()=>state.players.filter(p=>p.modalidad===state.mode).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')), games=()=>state.matches.filter(m=>m.modalidad===state.mode).sort((a,b)=>b.fecha.localeCompare(a.fecha)), entries=m=>Array.isArray(m.participaciones)?m.participaciones:[], name=id=>state.players.find(p=>p.id===id)?.nombre||'Jugador';
function parseJson(v,fb){if(v&&typeof v==='object')return v;try{let x=JSON.parse(v||'');return x&&typeof x==='object'?x:fb}catch{return fb}}function note(t,ok=false){$('message').innerHTML=t?`<div class="message ${ok?'ok':''}">${esc(t)}</div>`:''}function loginNote(t){$('loginmsg').innerHTML=t?`<div class="message">${esc(t)}</div>`:''}
async function load(){let [{data:ps,error:pe},{data:ms,error:me}]=await Promise.all([db.from('futbol_personal_jugadores').select('*').order('nombre'),db.from('futbol_personal_partidos').select('*').order('fecha',{ascending:false})]);if(pe||me)throw(pe||me);state.players=ps||[];state.matches=(ms||[]).map(m=>({...m,participaciones:parseJson(m.participaciones,[]),alineacion:parseJson(m.alineacion,{})}));render()}
function totals(pid){return games().reduce((r,m)=>{let e=entries(m).find(x=>x.id===pid);if(e){r.games++;r.starts+=e.starter?1:0;r.minutes+=Number(e.minutes)||0;r.goals+=Number(e.goals)||0}return r},{games:0,starts:0,minutes:0,goals:0})}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));let all=games().flatMap(entries);$('stats').innerHTML=[['Jugadores',roster().length],['Partidos',games().length],['Minutos',all.reduce((a,x)=>a+(Number(x.minutes)||0),0)],['Goles',all.reduce((a,x)=>a+(Number(x.goals)||0),0)]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('view').innerHTML=state.draft?editor():state.tab==='plantilla'?players():state.tab==='partidos'?matches():summary()}
function players(){return `<section class="panel"><div class="bar"><div><h2>Plantilla · Fútbol ${state.mode}</h2><p class="muted">Añade nombres y fotos.</p></div><button class="primary" data-action="add-player">+ Jugador</button></div>${roster().length?roster().map(p=>{let t=totals(p.id);return `<div class="row">${avatar(p)}<div class="info"><strong>${esc(p.nombre)}</strong><small>${t.games} partidos · ${t.minutes} min · ${t.goals} goles · ${t.starts} titularidades</small></div><div class="actions"><button class="secondary small" data-action="edit-player" data-id="${p.id}">Editar</button><button class="danger small" data-action="delete-player" data-id="${p.id}">Borrar</button></div></div>`}).join(''):`<div class="blank">Todavía no hay jugadores.</div>`}</section>`}
function matches(){return `<section class="panel"><div class="bar"><div><h2>Partidos · Fútbol ${state.mode}</h2><p class="muted">Guarda convocatoria, titulares, posición, minutos y goles.</p></div><button class="primary" data-action="add-match">+ Partido</button></div>${games().length?games().map(m=>{let e=entries(m),a=m.alineacion||{};return `<div class="row"><div class="avatar">⚽</div><div class="info"><strong>${esc(m.rival)}</strong><small>${esc(m.fecha)} · ${e.length} convocados · ${e.reduce((s,x)=>s+(Number(x.minutes)||0),0)} min · ${e.reduce((s,x)=>s+(Number(x.goals)||0),0)} goles</small><small>${resChip(a)}${esc(a.formation||'Sin formación')} · Inicial: ${e.filter(x=>x.starter).map(x=>esc(name(x.id))).join(', ')}</small></div><div class="actions"><button class="secondary small" data-img="${m.id}">Imagen</button><button class="secondary small" data-action="edit-match" data-id="${m.id}">Editar</button><button class="danger small" data-action="delete-match" data-id="${m.id}">Borrar</button></div></div>`}).join(''):`<div class="blank">Todavía no hay partidos.</div>`}</section>`}
function resChip(a){let r=a&&a.resultado;if(!r)return'';let c=r.gf>r.gc?['w','Victoria']:r.gf<r.gc?['l','Derrota']:['d','Empate'];return `<span class="res ${c[0]}">${c[1]} ${r.gf}-${r.gc}</span> `}
function summary(){let gs=games(),rs=gs.filter(m=>m.alineacion&&m.alineacion.resultado),R=m=>m.alineacion.resultado,W=rs.filter(m=>R(m).gf>R(m).gc).length,L=rs.filter(m=>R(m).gf<R(m).gc).length,D=rs.length-W-L,GF=rs.reduce((s,m)=>s+R(m).gf,0),GC=rs.reduce((s,m)=>s+R(m).gc,0),dif=GF-GC;
let team=`<section class="panel"><h2>Equipo · Fútbol ${state.mode}</h2>${rs.length?`<div class="tstats">${[['Victorias',W],['Empates',D],['Derrotas',L],['Goles a favor',GF],['Goles en contra',GC],['Diferencia',(dif>0?'+':'')+dif]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><p class="muted" style="margin-top:10px">${rs.length} de ${gs.length} partidos con resultado.</p>`:'<p class="muted">Pon el resultado al guardar un partido y aquí saldrán victorias, empates, derrotas y goles a favor y en contra.</p>'}</section>`;
let list=gs.length?`<section class="panel"><h2>Resultados</h2>${gs.map(m=>{let r=m.alineacion&&m.alineacion.resultado,c=r?(r.gf>r.gc?'w':r.gf<r.gc?'l':'d'):'';return `<div class="row"><div class="avatar res ${c}">${r?(c==='w'?'V':c==='l'?'D':'E'):'·'}</div><div class="info"><strong>${esc(m.rival)}</strong><small>${esc(m.fecha)} · ${r?`${r.gf>r.gc?'Victoria':r.gf<r.gc?'Derrota':'Empate'} ${r.gf}-${r.gc}`:'Sin resultado'}</small></div></div>`}).join('')}</section>`:'';
return team+list+playerSummary()}
function playerSummary(){return `<section class="panel"><h2>Estadísticas · Fútbol ${state.mode}</h2>${roster().length?roster().map(p=>{let t=totals(p.id);return `<div class="row">${avatar(p)}<div class="info"><strong>${esc(p.nombre)}</strong><small>${t.games} partidos · ${t.starts} titularidades · ${t.minutes} minutos · ${t.goals} goles</small></div></div>`}).join(''):`<div class="blank">Añade jugadores y partidos para ver el resumen.</div>`}</section>`}
function blankAlign(){let f=Object.keys(formations[state.mode])[0];return {formation:f,slots:{}}}function editor(){let d=state.draft,f=formations[state.mode][d.alineacion.formation]||formations[state.mode][Object.keys(formations[state.mode])[0]],slots=d.alineacion.slots||{},start=d.players.filter(x=>x.starter);let choices=roster().map(p=>{let x=d.players.find(e=>e.id===p.id);return `<div class="checkline"><span>${esc(p.nombre)}</span><input type="checkbox" data-field="called" data-id="${p.id}" ${x?'checked':''}><input type="checkbox" data-field="starter" data-id="${p.id}" ${x?.starter?'checked':''}><input type="number" data-field="minutes" data-id="${p.id}" min="0" value="${x?.minutes||0}" ${x?'':'disabled'}><input type="number" data-field="goals" data-id="${p.id}" min="0" value="${x?.goals||0}" ${x?'':'disabled'}></div>`}).join('');return `<section class="panel"><div class="bar"><div><h2>${state.editing?'Editar':'Nuevo'} partido · Fútbol ${state.mode}</h2><p class="muted">${d.players.length}${state.mode==='7'?' / 14':''} convocados · ${start.length}/${modeCount()} titulares</p></div><button class="secondary small" data-action="cancel">Volver</button></div><div class="formgrid"><label>Fecha<input id="date" type="date" value="${esc(d.fecha)}"></label><label>Rival<input id="rival" value="${esc(d.rival)}" maxlength="100"></label></div><div class="formgrid"><label>Goles a favor<input id="gf" type="number" min="0" max="99" inputmode="numeric" placeholder="Resultado (opcional)" value="${esc(d.gf)}"></label><label>Goles en contra<input id="gc" type="number" min="0" max="99" inputmode="numeric" placeholder="Resultado (opcional)" value="${esc(d.gc)}"></label></div><div class="lineup-layout"><div><div class="position-help"><h3>Campo y posiciones</h3><select id="formation">${Object.keys(formations[state.mode]).map(x=>`<option ${x===d.alineacion.formation?'selected':''}>${x}</option>`).join('')}</select></div><div class="tools"><button class="secondary small" data-wipe="1">Limpiar campo</button><button class="primary small" data-img="draft">Descargar imagen</button><span class="muted">Arrastra un jugador al campo, o toca una posición y luego un jugador.</span></div><div class="pchips">${roster().map(p=>{let at=Object.values(slots).includes(p.id);return `<div class="pchip ${at?'placed':''} ${state.selectedChip===p.id?'sel':''}" data-chip="${p.id}">${avatar(p)}<span>${esc(p.nombre)}</span></div>`}).join('')||'<span class="muted">Añade primero jugadores en Plantilla.</span>'}</div><div class="field"><div class="line mid"></div><div class="circle"></div>${f.map((s,i)=>{let pid=slots[i];return `<div class="slot" style="left:${s[1]}%;top:${s[2]}%"><button data-slot="${i}" class="${state.selectedSlot===i?'sel':''}" title="${pid?'Arrastra para mover':'Elegir jugador'}">${pid?esc((name(pid)[0]||'?').toUpperCase()):'+'}</button><span>${pid?esc(name(pid)):s[0]}</span></div>`}).join('')}</div><div class="slotmenu">${state.selectedSlot!==null?roster().map(p=>`<button class="${slots[state.selectedSlot]===p.id?'selected':''}" data-pick="${p.id}">${esc(p.nombre)}</button>`).join('')+(slots[state.selectedSlot]?'<button class="danger" data-clear="1">Quitar jugador</button>':''):'<span class="muted">Toca una posición para elegir jugador, o arrástralo desde arriba.</span>'}</div></div><div><h3>Convocatoria</h3><div class="checkline muted"><span>Jugador</span><span>Conv.</span><span>Inicial</span><span>Min.</span><span>Goles</span></div>${choices||'<div class="blank">Añade primero jugadores en Plantilla.</div>'}<h3 style="margin-top:17px">Inicial</h3><div>${start.map(x=>`<span class="badge">${esc(name(x.id))}</span>`).join('')||'<span class="muted">Selecciona titulares.</span>'}</div></div></div><button class="primary" data-action="save" ${state.busy?'disabled':''}>Guardar partido</button> <button class="secondary" data-action="cancel">Cancelar</button></section>`}
function place(i,pid){const d=state.draft,sl=d.alineacion.slots,prev=sl[i],from=Object.keys(sl).find(k=>sl[k]===pid);if(prev===pid)return true;let x=d.players.find(p=>p.id===pid);if(!x&&state.mode==='7'&&d.players.length>=14){note('Máximo 14 convocados para fútbol 7.');return false}
if(from===undefined){let st=d.players.filter(p=>p.starter&&p.id!==prev).length;if(!(x&&x.starter)&&st>=modeCount()){note(`Ya hay ${modeCount()} titulares en el campo. Quita a alguien primero.`);return false}}
if(!x){x={id:pid,nombre:name(pid),minutes:0,goals:0,starter:false};d.players.push(x)}
if(from===undefined){if(prev){let pp=d.players.find(p=>p.id===prev);if(pp)pp.starter=false}x.starter=true;sl[i]=pid}else{if(prev)sl[from]=prev;else delete sl[from];sl[i]=pid}note('');return true}
function unplace(i){let d=state.draft,pid=d.alineacion.slots[i];delete d.alineacion.slots[i];let p=d.players.find(x=>x.id===pid);if(p)p.starter=false}
function clearField(){let d=state.draft;d.alineacion.slots={};d.players.forEach(p=>p.starter=false);state.selectedSlot=null;state.selectedChip=null;note('Campo limpio. Puedes empezar de nuevo.',true)}

async function drawLineup(o){const W=1080,H=1520,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d'),ff='system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';

async function imgExport(which){let o;if(which==='draft'){let d=state.draft,gfv=($('gf')||{value:''}).value.trim(),gcv=($('gc')||{value:''}).value.trim(),al=JSON.parse(JSON.stringify(d.alineacion));if(gfv||gcv)al.resultado={gf:parseInt(gfv)||0,gc:parseInt(gcv)||0};else delete al.resultado;o={modalidad:state.mode,fecha:($('date')||{}).value||d.fecha,rival:(($('rival')||{}).value||d.rival||'').trim(),players:d.players,alineacion:al}}else{let m=state.matches.find(x=>x.id===which);if(!m)return;o={modalidad:m.modalidad,fecha:m.fecha,rival:m.rival,players:entries(m),alineacion:m.alineacion||{}}}

let file=new File([blob],fname,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})&&window.matchMedia('(pointer:coarse)').matches){try{await navigator.share({files:[file],title:'Alineación'});return}catch(e){if(e&&e.name==='AbortError')return}}

async function savePlayer(e){e.preventDefault();let form=e.target,name=form.nombre.value.trim(),file=form.foto.files[0],original=state.players.find(p=>p.id===state.playerId),foto=original?.foto||'';if(file)foto=await resize(file);let payload={modalidad:state.mode,nombre:name,foto};if(!original){payload.id=crypto.randomUUID();payload.owner_id=(await db.auth.getUser()).data.user.id}let q=original?db.from('futbol_personal_jugadores').update(payload).eq('id',original.id):db.from('futbol_personal_jugadores').insert(payload);let {error}=await q;if(error)throw error;$('modal').classList.add('hidden');state.playerId=null;await load();note('Jugador guardado.',true)}
async function resize(file){if(!file.type.startsWith('image/'))throw Error('Selecciona una imagen válida.');let b=await createImageBitmap(file),canvas=document.createElement('canvas'),r=Math.min(1,240/Math.max(b.width,b.height));canvas.width=Math.max(1,Math.round(b.width*r));canvas.height=Math.max(1,Math.round(b.height*r));canvas.getContext('2d').drawImage(b,0,0,canvas.width,canvas.height);b.close();return canvas.toDataURL('image/jpeg',.72)}
async function saveMatch(){let d=state.draft;d.fecha=$('date').value;d.rival=$('rival').value.trim();if(!d.fecha||!d.rival)return note('Indica fecha y rival.');{let gfv=$('gf').value.trim(),gcv=$('gc').value.trim();if(gfv!==''||gcv!=='')d.alineacion.resultado={gf:Math.min(99,Math.max(0,parseInt(gfv)||0)),gc:Math.min(99,Math.max(0,parseInt(gcv)||0))};else delete d.alineacion.resultado}if(d.players.length<modeCount())return note(`Necesitas al menos ${modeCount()} convocados.`);if(d.players.filter(x=>x.starter).length!==modeCount())return note(`Selecciona exactamente ${modeCount()} titulares.`);let starters=new Set(d.players.filter(x=>x.starter).map(x=>x.id));d.alineacion.slots=Object.fromEntries(Object.entries(d.alineacion.slots||{}).filter(([,pid])=>starters.has(pid)));let payload={modalidad:state.mode,fecha:d.fecha,rival:d.rival,participaciones:JSON.stringify(d.players.map(x=>({...x,minutes:Number(x.minutes)||0,goals:Number(x.goals)||0,nombre:name(x.id)}))),alineacion:JSON.stringify(d.alineacion)};if(!state.editing){payload.id=crypto.randomUUID();payload.owner_id=(await db.auth.getUser()).data.user.id}state.busy=true;render();let result=state.editing?await db.from('futbol_personal_partidos').update(payload).eq('id',state.editing):await db.from('futbol_personal_partidos').insert(payload);state.busy=false;if(result.error)return note(result.error.message);state.draft=null;state.editing=null;note('Partido, formación y posiciones guardados.',true);await load()}

function change(field,id,input){let d=state.draft,x=d.players.find(p=>p.id===id);if(field==='called'||field==='starter'){if(input.checked&&!x){if(state.mode==='7'&&d.players.length>=14){input.checked=false;return note('Máximo 14 convocados para fútbol 7.')}x={id,nombre:name(id),minutes:0,goals:0,starter:false};d.players.push(x)}if(field==='called'&&!input.checked){d.players=d.players.filter(p=>p.id!==id);Object.keys(d.alineacion.slots||{}).forEach(k=>{if(d.alineacion.slots[k]===id)delete d.alineacion.slots[k]})}if(field==='starter'&&x){if(input.checked&&d.players.filter(p=>p.starter).length>=modeCount()){input.checked=false;return note(`Solo ${modeCount()} titulares como máximo.`)}x.starter=input.checked;if(!input.checked)Object.keys(d.alineacion.slots||{}).forEach(k=>{if(d.alineacion.slots[k]===id)delete d.alineacion.slots[k]})}return render()}if(x)x[field]=input.value}
$('auth').addEventListener('click',async e=>{if(!e.target.dataset.auth)return;e.preventDefault();let email=$('auth').email.value,password=$('auth').password.value,kind=e.target.dataset.auth,result=await db.auth.signInWithPassword({email,password});if(result.error)return loginNote(result.error.message);loginNote('')});$('logout').onclick=()=>db.auth.signOut();$('playerForm').onsubmit=async e=>{try{await savePlayer(e)}catch(x){note(x.message)}};$('closeModal').onclick=()=>$('modal').classList.add('hidden');document.addEventListener('click',e=>{if(state.justDragged)return;let im=e.target.closest('[data-img]');if(im){imgExport(im.dataset.img).catch(x=>note('No se pudo crear la imagen: '+x.message));return}let mode=e.target.closest('[data-mode]'),tab=e.target.closest('[data-tab]'),a=e.target.closest('[data-action]');if(mode){state.mode=mode.dataset.mode;state.tab='plantilla';state.draft=null;render()}else if(tab){state.tab=tab.dataset.tab;state.draft=null;render()}else if(a){let id=a.dataset.id;if(a.dataset.action==='add-player'){state.playerId=null;$('playerForm').reset();$('modalTitle').textContent='Nuevo jugador';$('modal').classList.remove('hidden')}if(a.dataset.action==='edit-player'){let p=state.players.find(x=>x.id===id);state.playerId=id;$('playerForm').nombre.value=p.nombre;$('modalTitle').textContent='Editar jugador';$('modal').classList.remove('hidden')}if(a.dataset.action==='delete-player')remove('futbol_personal_jugadores',id);if(a.dataset.action==='add-match'){state.editing=null;resetDraft()}if(a.dataset.action==='edit-match'){state.editing=id;resetDraft(state.matches.find(x=>x.id===id))}if(a.dataset.action==='delete-match')remove('futbol_personal_partidos',id);if(a.dataset.action==='cancel'){state.draft=null;state.editing=null;render()}if(a.dataset.action==='save')saveMatch()}if(!state.draft)return;let slot=e.target.closest('button[data-slot]'),chip=e.target.closest('[data-chip]'),pick=e.target.closest('[data-pick]'),clear=e.target.closest('[data-clear]'), if(slot){let i=Number(slot.dataset.slot);if(state.selectedChip){if(place(i,state.selectedChip)){state.selectedChip=null;state.selectedSlot=null}}else state.selectedSlot=state.selectedSlot===i?null:i;render()}
else if(chip){let id=chip.dataset.chip;if(state.selectedSlot!==null){if(place(state.selectedSlot,id))state.selectedSlot=null}else state.selectedChip=state.selectedChip===id?null:id;render()}
else if(pick&&state.selectedSlot!==null){if(place(state.selectedSlot,pick.dataset.pick))state.selectedSlot=null;render()}

else if(wipe){clearField();render()}
});$('view').addEventListener('change',e=>{if(e.target.id==='formation'){state.draft.alineacion.formation=e.target.value;render()}if(e.target.dataset.field)change(e.target.dataset.field,e.target.dataset.id,e.target)});$('view').addEventListener('input',e=>{if(e.target.dataset.field&&['minutes','goals'].includes(e.target.dataset.field))change(e.target.dataset.field,e.target.dataset.id,e.target);if(e.target.id==='date'&&state.draft)state.draft.fecha=e.target.value;if(e.target.id==='rival'&&state.draft)state.draft.rival=e.target.value;if(e.target.id==='gf'&&state.draft)state.draft.gf=e.target.value;if(e.target.id==='gc'&&state.draft)state.draft.gc=e.target.value});
