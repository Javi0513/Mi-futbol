<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102724"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Fútbol"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Mi Fútbol | Plantillas y estadísticas</title><style>

ckground:#396349;display:grid;place-items:center;font-weight:800}.info{min-width:0;flex:1}.info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{display:block;color:#bad0bc;font-size:12px;margin-top:4px}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-block;color:#e0ffc4;background:#355841;border-radius:25px;padding:5px 9px;font-size:12px;font-weight:700}.blank{text-align:center;padding:48px 10px;color:#a9beaf}.blank b{display:block;color:#eff9ec;font-size:17px;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label.field{display:grid;gap:7px;margin:10px 0 16px;font-size:13px;color:#c6dcc8;font-weight:650}.field input{padding:11px;border:1px solid #456d52;border-radius:10px;background:#11251e;color:white;width:100%}.message{padding:11px;border-radius:10px;background:#3d3d34;margin:10px 0;color:#ffe5c9;font-size:13px}.message.ok{background:#284435;color:#d9ffc2}.playerline{display:grid;grid-template-columns:minmax(130px,1fr) 60px 60px 72px 65px;gap:5px;align-items:center;padding:9px 0;border-bottom:1px solid #345044}.playerline label{text-align:center;font-size:11px;color:#bcd3c0}.playerline input[type=checkbox]{accent-color:#c8f293;width:18px;height:18px}.playerline input[type=number]{width:100%;padding:8px 3px;text-align:center;background:#10271e;border:1px solid #456d52;color:white;border-radius:9px}.playerline .who{display:flex;align-items:center;gap:7px;min-width:0}.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who .avatar{width:30px;height:30px}.lineup{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 22px}.dialogbg{position:fixed;inset:0;display:grid;place-items:center;background:#05170fce;padding:15px}.dialog{background:#1c3529;border:1px solid #568261;border-radius:19px;padding:22px;width:min(100%,450px)}.dialog h2{margin:0 0 20px}.preview{width:70px;height:70px;object-fit:cover;border-radius:13px}.hidden{display:none!impor </style></head><body><section id="login" class="panel auth"><h2>Accede a Mi Fútbol</h2><p>Usa el correo y la contraseña privados de esta aplicación.</p><p id="login-error" role="alert"></p><form id="loginform"><label class="field">Correo<input type="email" name="email" autocomplete="username" required></label><label class="field">Contraseña<input type="password" name="password" autocomplete="current-password" required></label><button type="submit" class="primary">Entrar</button></form></section><main class="wrap" id="app" hidden><header><div class="over">Gestiona tu equipo</div><h1>Mi Fútbol<span style="color:#c8f293">.</span></h1><p>Jugadores, convocatorias, alineaciones y números por partido.</p></header><button id="logout" class="secondary" style="float:right">Salir</button><div class="switch"><button data-mode="7" class="on">Fútbol 7</button><button data-mode="11">Fútbol 11</button></div><div id="message" aria-live="polite"></div><div class="stats" id="stats"></div><div class="tabs"><button data-tab="plantilla" class="on">Plantilla</button><button data-tab="partidos">Partidos</button><button data-tab="resumen">Estadísticas</button></div><div id="view"></div></main><div class="dialogbg hidden" id="dialog"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><h2 id="dialogtitle">Jugador</h2><form id="playerform"><label class="field">Nombre<input name="nombre" required maxlength="90" placeholder="Nombre del jugador"></label><label class="field">Foto (opcional)<input name="foto" type="file" accept="image/*"></label><img class="preview hidden" id="preview" alt="Foto seleccionada"><div class="actions" style="justify-content:flex-start;margin-top:16px"><button class="primary" type="submit">Guardar</button><button class="secondary" type="button" id="close">Cancelar</button></div></form></div></div><script type="module" src="./app.js"></script></body></html>
