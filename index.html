<body><main class="wrap"><section id="login" class="panel login"><h1>Mi Fútbol<span style="color:#c8f293">.</span></h1><p class="muted">Acceso privado del equipo.</p><div id="loginmsg"></div><form id="auth"><label>Email<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="6" required></label><div class="actions"><button class="primary" data-auth="login">Entrar</button></div></form></section>
<section id="app" class="hidden"><div class="topbar"><div><div class="over">Gestiona tu equipo</div><h1>Mi Fútbol<span style="color:#c8f293">.</span></h1><p class="muted">Alineaciones, minutos y estadísticas.</p></div><button class="secondary small" id="logout">Salir</button></div><div class="switch"><button data-mode="7" class="on">Fútbol 7</button><button data-mode="11">Fútbol 11</button></div><div id="message"></div><div id="stats" class="stats"></div><div class="tabs"><button data-tab="plantilla" class="on">Plantilla</button><button data-tab="partidos">Partidos</button><button data-tab="resumen">Estadísticas</button></div><div id="view"></div></section></main>
<div id="modal" class="modal hidden"><div class="dialog"><h2 id="modalTitle">Jugador</h2><form id="playerForm"><label>Nombre<input name="nombre" required maxlength="90"></label><label>Foto<input name="foto" type="file" accept="image/*"></label><div class="actions"><button class="primary">Guardar</button><button type="button" class="secondary" id="closeModal">Cancelar</button></div></form></div></div>
<script>
(()=>{const c=window.APP_CONFIG||{};const db=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const state={mode:'7',tab:'plantilla',players:[],matches:[],draft:null,editing:null,selectedSlot:null,playerId:null,busy:false};const formations={7:{'2-3-1':[['POR',50,91],['DEF',35,72],['DEF',65,72],['MED',20,52],['MED',50,52],['MED',80,52],['ATA',50,25]],'3-2-1':[['POR',50,91],['DEF',22,72],['DEF',50,76],['DEF',78,72],['MED',35,52],['MED',65,52],['ATA',50,25]],'3-3':[['POR',50,91],['DEF',22,72],['DEF',50,76],['DEF',78,72],['MED',25,45],['MED',50,39],['MED',75,45]]},11:{'4-3-3':[['POR',50,93],['DEF',15,72],['DEF',38,76],['DEF',62,76],['DEF',85,72],['MED',25,52],['MED',50,47],['MED',75,52],['ATA',18,24],['ATA',50,19],['ATA',82,24]],'4-4-2':[['POR',50,93],['DEF',15,72],['DEF',38,76],['DEF',62,76],['DEF',85,72],['MED',15,49],['MED',38,43],['MED',62,43],['MED',85,49],['ATA',35,23],['ATA',65,23]],'3-4-3':[['POR',50,93],['DEF',22,73],['DEF',50,77],['DEF',78,73],['MED',12,51],['MED',36,46],['MED',64,46],['MED',88,51],['ATA',22,24],['ATA',50,18],['ATA',78,24]]}};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])), avatar=p=>p?.foto?.startsWith('data:')?`<img class="avatar" src="${esc(p.foto)}" alt="">`:`<div class="avatar">${esc((p?.nombre||'?')[0].toUpperCase())}</div>`, modeCount=()=>Number(state.mode), roster=()=>state.players.filter(p=>p.modalidad===state.mode).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')), games=()=>state.matches.filter(m=>m.modalidad===state.mode).sort((a,b)=>b.fecha.localeCompare(a.fecha)), entries=m=>Array.isArray(m.participaciones)?m.participaciones:[], name=id=>state.players.find(p=>p.id===id)?.nombre||'Jugador';
function parseJson(v,fb){if(v&&typeof v==='object')return v;try{let x=JSON.parse(v||'');return x&&typeof x==='object'?x:fb}catch{return fb}}function note(t,ok=false){$('message').innerHTML=t?`<div class="message ${ok?'ok':''}">${esc(t)}</div>`:''}function loginNote(t){$('loginmsg').innerHTML=t?`<div class="message">${esc(t)}</div>`:''}
async function load(){let [{data:ps,error:pe},{data:ms,error:me}]=await Promise.all([db.from('futbol_personal_jugadores').select('*').order('nombre'),db.from('futbol_personal_partidos').select('*').order('fecha',{ascending:false})]);if(pe||me)throw(pe||me);state.players=ps||[];state.matches=(ms||[]).map(m=>({...m,participaciones:parseJson(m.participaciones,[]),alineacion:parseJson(m.alineacion,{})}));render()}
function totals(pid){return games().reduce((r,m)=>{let e=entries(m).find(x=>x.id===pid);if(e){r.games++;r.starts+=e.starter?1:0;r.minutes+=Number(e.minutes)||0;r.goals+=Number(e.goals)||0}return r},{games:0,starts:0,minutes:0,goals:0})}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));let all=games().flatMap(entries);$('stats').innerHTML=[['Jugadores',roster().length],['Partidos',games().length],['Minutos',all.reduce((a,x)=>a+(Number(x.minutes)||0),0)],['Goles',all.reduce((a,x)=>a+(Number(x.goals)||0),0)]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('view').innerHTML=state.draft?editor():state.tab==='plantilla'?players():state.tab==='partidos'?matches():summary()}
function players(){return `<section class="panel"><div class="bar"><div><h2>Plantilla · Fútbol ${state.mode}</h2><p class="muted">Añade nombres y fotos.</p></div><button class="primary" data-action="add-player">+ Jugador</button></div>${roster().length?roster().map(p=>{let t=totals(p.id);return `<div class="row">${avatar(p)}<div class="info"><strong>${esc(p.nombre)}</strong><small>${t.games} partidos · ${t.minutes} min · ${t.goals} goles · ${t.starts} titularidades</small></div><div class="actions"><button class="secondary small" data-action="edit-player" data-id="${p.id}">Editar</button><button class="danger small" data-action="delete-player" data-id="${p.id}">Borrar</button></div></div>`}).join(''):`<div class="blank">Todavía no hay jugadores.</div>`}</section>`}
function matches(){return `<section class="panel"><div class="bar"><div><h2>Partidos · Fútbol ${state.mode}</h2><p class="muted">Guarda convocatoria, titulares, posición, minutos y goles.</p></div><button class="primary" data-action="add-match">+ Partido</button></div>${games().length?games().map(m=>{let e=entries(m),a=m.alineacion||{};return `<div class="row"><div class="avatar">⚽</div><div class="info"><strong>${esc(m.rival)}</strong><small>${esc(m.fecha)} · ${e.length} convocados · ${e.reduce((s,x)=>s+(Number(x.minutes)||0),0)} min · ${e.reduce((s,x)=>s+(Number(x.goals)||0),0)} goles</small><small>${esc(a.formation||'Sin formación')} · Inicial: ${e.filter(x=>x.starter).map(x=>esc(name(x.id))).join(', ')}</small></div><div class="actions"><button class="secondary small" data-action="edit-match" data-id="${m.id}">Editar</button><button class="danger small" data-action="delete-match" data-id="${m.id}">Borrar</button></div></div>`}).join(''):`<div class="blank">Todavía no hay partidos.</div>`}</section>`}
function summary(){return `<section class="panel"><h2>Estadísticas · Fútbol ${state.mode}</h2>${roster().length?roster().map(p=>{let t=totals(p.id);return `<div class="row">${avatar(p)}<div class="info"><strong>${esc(p.nombre)}</strong><small>${t.games} partidos · ${t.starts} titularidades · ${t.minutes} minutos · ${t.goals} goles</small></div></div>`}).join(''):`<div class="blank">Añade jugadores y partidos para ver el resumen.</div>`}</section>`}
function blankAlign(){let f=Object.keys(formations[state.mode])[0];return {formation:f,slots:{}}}function editor(){let d=state.draft,f=formations[state.mode][d.alineacion.formation]||formations[state.mode][Object.keys(formations[state.mode])[0]],slots=d.alineacion.slots||{},start=d.players.filter(x=>x.starter);let choices=roster().map(p=>{let x=d.players.find(e=>e.id===p.id);return `<div class="checkline"><span>${esc(p.nombre)}</span><input type="checkbox" data-field="called" data-id="${p.id}" ${x?'checked':''}><input type="checkbox" data-field="starter" data-id="${p.id}" ${x?.starter?'checked':''}><input type="number" data-field="minutes" data-id="${p.id}" min="0" value="${x?.minutes||0}" ${x?'':'disabled'}><input type="number" data-field="goals" data-id="${p.id}" min="0" value="${x?.goals||0}" ${x?'':'disabled'}></div>`}).join('');return `<section class="panel"><div class="bar"><div><h2>${state.editing?'Editar':'Nuevo'} partido · Fútbol ${state.mode}</h2><p class="muted">${d.players.length}${state.mode==='7'?' / 14':''} convocados · ${start.length}/${modeCount()} titulares</p></div><button class="secondary small" data-action="cancel">Volver</button></div><div class="formgrid"><label>Fecha<input id="date" type="date" value="${esc(d.fecha)}"></label><label>Rival<input id="rival" value="${esc(d.rival)}" maxlength="100"></label></div><div class="lineup-layout"><div><div class="position-help"><h3>Campo y posiciones</h3><select id="formation">${Object.keys(formations[state.mode]).map(x=>`<option ${x===d.alineacion.formation?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><div class="line mid"></div><div class="circle"></div>${f.map((s,i)=>{let pid=slots[i];return `<div class="slot" style="left:${s[1]}%;top:${s[2]}%"><button data-slot="${i}" title="Elegir jugador">${pid?'⚽':'+'}</button><span>${pid?esc(name(pid)):s[0]}</span></div>`}).join('')}</div><div class="slotmenu">${state.selectedSlot!==null?roster().filter(p=>d.players.some(x=>x.id===p.id)).map(p=>`<button class="${slots[state.selectedSlot]===p.id?'selected':''}" data-pick="${p.id}">${esc(p.nombre)}</button>`).join('')+(slots[state.selectedSlot]?'<button class="danger" data-clear="1">Quitar jugador</button>':''):'<span class="muted">Pulsa una posición del campo para asignar un jugador.</span>'}</div></div><div><h3>Convocatoria</h3><div class="checkline muted"><span>Jugador</span><span>Conv.</span><span>Inicial</span><span>Min.</span><span>Goles</span></div>${choices||'<div class="blank">Añade primero jugadores en Plantilla.</div>'}<h3 style="margin-top:17px">Inicial</h3><div>${start.map(x=>`<span class="badge">${esc(name(x.id))}</span>`).join('')||'<span class="muted">Selecciona titulares.</span>'}</div></div></div><button class="primary" data-action="save" ${state.busy?'disabled':''}>Guardar partido</button> <button class="secondary" data-action="cancel">Cancelar</button></section>`}
function resetDraft(m){state.draft={fecha:m?.fecha||new Date().toISOString().slice(0,10),rival:m?.rival||'',players:m?entries(m).map(x=>({...x})):[],alineacion:m?.alineacion&&typeof m.alineacion==='object'?JSON.parse(JSON.stringify(m.alineacion)):blankAlign()};state.selectedSlot=null;let al=state.draft.alineacion;if(!formations[state.mode][al.formation])al.formation=Object.keys(formations[state.mode])[0];if(!al.slots||typeof al.slots!=='object')al.slots={};render()}
async function savePlayer(e){e.preventDefault();let form=e.target,name=form.nombre.value.trim(),file=form.foto.files[0],original=state.players.find(p=>p.id===state.playerId),foto=original?.foto||'';if(file)foto=await resize(file);let payload={modalidad:state.mode,nombre:name,foto};if(!original){payload.id=crypto.randomUUID();payload.owner_id=(await db.auth.getUser()).data.user.id}let q=original?db.from('futbol_personal_jugadores').update(payload).eq('id',original.id):db.from('futbol_personal_jugadores').insert(payload);let {error}=await q;if(error)throw error;$('modal').classList.add('hidden');state.playerId=null;await load();note('Jugador guardado.',true)}
async function resize(file){if(!file.type.startsWith('image/'))throw Error('Selecciona una imagen válida.');let b=await createImageBitmap(file),canvas=document.createElement('canvas'),r=Math.min(1,240/Math.max(b.width,b.height));canvas.width=Math.max(1,Math.round(b.width*r));canvas.height=Math.max(1,Math.round(b.height*r));canvas.getContext('2d').drawImage(b,0,0,canvas.width,canvas.height);b.close();return canvas.toDataURL('image/jpeg',.72)}
async function saveMatch(){let d=state.draft;d.fecha=$('date').value;d.rival=$('rival').value.trim();if(!d.fecha||!d.rival)return note('Indica fecha y rival.');if(d.players.length<modeCount())return note(`Necesitas al menos ${modeCount()} convocados.`);if(d.players.filter(x=>x.starter).length!==modeCount())return note(`Selecciona exactamente ${modeCount()} titulares.`);let starters=new Set(d.players.filter(x=>x.starter).map(x=>x.id));d.alineacion.slots=Object.fromEntries(Object.entries(d.alineacion.slots||{}).filter(([,pid])=>starters.has(pid)));let payload={modalidad:state.mode,fecha:d.fecha,rival:d.rival,participaciones:JSON.stringify(d.players.map(x=>({...x,minutes:Number(x.minutes)||0,goals:Number(x.goals)||0,nombre:name(x.id)}))),alineacion:JSON.stringify(d.alineacion)};if(!state.editing){payload.id=crypto.randomUUID();payload.owner_id=(await db.auth.getUser()).data.user.id}state.busy=true;render();let result=state.editing?await db.from('futbol_personal_partidos').update(payload).eq('id',state.editing):await db.from('futbol_personal_partidos').insert(payload);state.busy=false;if(result.error)return note(result.error.message);state.draft=null;state.editing=null;note('Partido, formación y posiciones guardados.',true);await load()}
async function remove(table,id){if(!confirm('¿Borrar este registro?'))return;let result=await db.from(table).delete().eq('id',id);if(result.error)return note(result.error.message);await load();note('Registro borrado.',true)}
function change(field,id,input){let d=state.draft,x=d.players.find(p=>p.id===id);if(field==='called'||field==='starter'){if(input.checked&&!x){if(state.mode==='7'&&d.players.length>=14){input.checked=false;return note('Máximo 14 convocados para fútbol 7.')}x={id,nombre:name(id),minutes:0,goals:0,starter:false};d.players.push(x)}if(field==='called'&&!input.checked){d.players=d.players.filter(p=>p.id!==id);Object.keys(d.alineacion.slots||{}).forEach(k=>{if(d.alineacion.slots[k]===id)delete d.alineacion.slots[k]})}if(field==='starter'&&x){if(input.checked&&d.players.filter(p=>p.starter).length>=modeCount()){input.checked=false;return note(`Solo ${modeCount()} titulares como máximo.`)}x.starter=input.checked}return render()}if(x)x[field]=input.value}
$('auth').addEventListener('click',async e=>{if(!e.target.dataset.auth)return;e.preventDefault();let email=$('auth').email.value,password=$('auth').password.value,kind=e.target.dataset.auth,result=await db.auth.signInWithPassword({email,password});if(result.error)return loginNote(result.error.message);loginNote('')});$('logout').onclick=()=>db.auth.signOut();$('playerForm').onsubmit=async e=>{try{await savePlayer(e)}catch(x){note(x.message)}};$('closeModal').onclick=()=>$('modal').classList.add('hidden');document.addEventListener('click',e=>{let mode=e.target.closest('[data-mode]'),tab=e.target.closest('[data-tab]'),a=e.target.closest('[data-action]');if(mode){state.mode=mode.dataset.mode;state.tab='plantilla';state.draft=null;render()}else if(tab){state.tab=tab.dataset.tab;state.draft=null;render()}else if(a){let id=a.dataset.id;if(a.dataset.action==='add-player'){state.playerId=null;$('playerForm').reset();$('modalTitle').textContent='Nuevo jugador';$('modal').classList.remove('hidden')}if(a.dataset.action==='edit-player'){let p=state.players.find(x=>x.id===id);state.playerId=id;$('playerForm').nombre.value=p.nombre;$('modalTitle').textContent='Editar jugador';$('modal').classList.remove('hidden')}if(a.dataset.action==='delete-player')remove('futbol_personal_jugadores',id);if(a.dataset.action==='add-match'){state.editing=null;resetDraft()}if(a.dataset.action==='edit-match'){state.editing=id;resetDraft(state.matches.find(x=>x.id===id))}if(a.dataset.action==='delete-match')remove('futbol_personal_partidos',id);if(a.dataset.action==='cancel'){state.draft=null;state.editing=null;render()}if(a.dataset.action==='save')saveMatch()}let slot=e.target.closest('[data-slot]');if(slot){state.selectedSlot=Number(slot.dataset.slot);render()}let pick=e.target.closest('[data-pick]');let clear=e.target.closest('[data-clear]');if(clear&&state.selectedSlot!==null){delete state.draft.alineacion.slots[state.selectedSlot];state.selectedSlot=null;render()}if(pick&&state.selectedSlot!==null){let sl=state.draft.alineacion.slots;Object.keys(sl).forEach(k=>{if(sl[k]===pick.dataset.pick)delete sl[k]});sl[state.selectedSlot]=pick.dataset.pick;state.selectedSlot=null;render()}});$('view').addEventListener('change',e=>{if(e.target.id==='formation'){state.draft.alineacion.formation=e.target.value;state.draft.alineacion.slots={};render()}if(e.target.dataset.field)change(e.target.dataset.field,e.target.dataset.id,e.target)});$('view').addEventListener('input',e=>{if(e.target.dataset.field&&['minutes','goals'].includes(e.target.dataset.field))change(e.target.dataset.field,e.target.dataset.id,e.target);if(e.target.id==='date'&&state.draft)state.draft.fecha=e.target.value;if(e.target.id==='rival'&&state.draft)state.draft.rival=e.target.value});
db.auth.onAuthStateChange(async(_event,session)=>{if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await load()}catch(e){note(e.message)}}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});db.auth.getSession();
})();
</script></body></html>
